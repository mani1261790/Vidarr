name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project Vidarr.xcodeproj \
            -scheme Vidarr \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
