name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project Vidarr.xcodeproj \
            -scheme Vidarr \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            clean build
