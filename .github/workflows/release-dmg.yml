name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      DEVELOPMENT_TEAM: PA8WHP7G46
      SIGNING_IDENTITY: "Developer ID Application"
    steps:
      - name: Check release credentials
        id: release-credentials
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          if [[ -n "$CERTIFICATE_P12_BASE64" \
             && -n "$CERTIFICATE_PASSWORD" \
             && -n "$NOTARY_API_KEY_P8_BASE64" \
             && -n "$NOTARY_API_KEY_ID" \
             && -n "$NOTARY_API_ISSUER_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release credentials are not configured; skipping the automated release build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.release-credentials.outputs.available == 'true'
        uses: actions/checkout@v7

      - name: Install DMG tool
        if: steps.release-credentials.outputs.available == 'true'
        run: brew install create-dmg

      - name: Import Developer ID certificate
        if: steps.release-credentials.outputs.available == 'true'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vidarr-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Prepare notarization key
        if: steps.release-credentials.outputs.available == 'true'
        env:
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: echo "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-api-key.p8"

      - name: Build, sign, and notarize DMG
        if: steps.release-credentials.outputs.available == 'true'
        env:
          NOTARY_API_KEY_PATH: ${{ runner.temp }}/notary-api-key.p8
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          ./scripts/build_dmg.sh "$TAG_NAME"

      - name: Upload Release Asset
        if: steps.release-credentials.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.dmg
          generate_release_notes: true
